<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> فائدة - تسجيل الدخول</title>
        <link rel="icon" type="image/x-icon" href="/static/assets/logo_only.png" />

    <link rel="stylesheet" href="/static/adobe-login/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><img src="/static/adobe-login/images/Turquoise And White Modern Web Development Service Facebook Ad_20240524_150242_٠٠٠٠.png" height="200px" width="400px"> </h1>
        </div>
        <div class="login-container">
            <h2>تسجيل الدخول</h2>
            <h5>مستخدم جديد؟ <a href="/register">انشاء حساب</a></h5>

            {% for message in get_flashed_messages() %}

            <style>
              .flash-message {
                background-color: #ff0000;
                color: #ffffff;
                padding: 10px;
                border-radius: 10px;
                border: 2px solid #d45725; /* Amazing border color */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                opacity: 1;
                transition: opacity 0.5s ease-in-out;
              }

              .fadeOut {
                opacity: 0;
              }
            </style>

            <div class="flash-message" role="alert">
              {{ message|safe }}
            </div>

            <script>
              document.addEventListener('DOMContentLoaded', function () {
                var flashMessage = document.querySelector('.flash-message');

                setTimeout(function () {
                  flashMessage.classList.add('fadeOut');
                  setTimeout(function () {
                    flashMessage.parentNode.removeChild(flashMessage);
                  }, 500); // 500 milliseconds for fade-out animation
                }, 5000); // 5000 milliseconds = 5 seconds
              });
            </script>

            {% endfor %}

            <form action="/login" method="post">
                <label for="username">البريد الالكتروني </label>
                <input type="email" id="username" name="email" required>
                <label for="username">كلمة المرور </label>
                <input type="password" id="username" name="password" required>


                <button type="submit" class="login_btn">تسجيل الدخول</button>
            </form>
            <div class="alternative-login">
                <p><span class="line"></span>أو سجل الدخول باستخدام<span class="line"></span></p>
                <button class="google-login">
                    <svg viewBox="0 0 1152 1152" width="30" height="30" focusable="false" aria-hidden="true" role="img" class="spectrum-Icon spectrum-Icon--sizeS" data-social-button-type="icon" data-social-white-background="true">
                        <path d="M1055.994 594.42a559.973 559.973 0 0 0-8.86-99.684h-458.99V683.25h262.28c-11.298 60.918-45.633 112.532-97.248 147.089v122.279h157.501c92.152-84.842 145.317-209.78 145.317-358.198z" fill="#4285f4"></path>
                        <path d="M588.144 1070.688c131.583 0 241.9-43.64 322.533-118.07l-157.5-122.28c-43.64 29.241-99.463 46.52-165.033 46.52-126.931 0-234.368-85.728-272.691-200.919H152.636v126.267c80.19 159.273 245 268.482 435.508 268.482z" fill="#34a853"></path>
                        <path d="M315.453 675.94a288.113 288.113 0 0 1 0-185.191V364.482H152.636a487.96 487.96 0 0 0 0 437.724z" fill="#fbbc05"></path>
                        <path d="M588.144 289.83c71.551 0 135.792 24.589 186.298 72.88l139.78-139.779C829.821 144.291 719.504 96 588.143 96c-190.507 0-355.318 109.21-435.508 268.482L315.453 490.75c38.323-115.19 145.76-200.919 272.691-200.919z" fill="#ea4335"></path>
                    </svg>
                    Google
                </button>
                <button class="facebook-login">
                    <img src="https://auth.services.adobe.com/img/social/f_logo_RGB-Blue_58.png" height="30px" width="30px" alt="">
                    Facebook
                </button>

                <button class="facebook-login">
                        <img src="https://auth.services.adobe.com/img/social/apple.svg" alt="">
                    Apple
                </button>
            </div>
            <div class="get-help">
                <h6>تحتاج مساعدة ؟ <a href="#"> تواصل معنا</a></h6>
            </div>
        </div>
    </div>

</body>
</html>
