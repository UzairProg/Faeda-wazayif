<!--
==============================================================================
الوظيفة الأساسية للملف: صفحة تسجيل دخول المدير.
==============================================================================
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير | فائدة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='new_design/images/Group.png') }}" type="image/x-icon">
    <style>
        :root {
            --admin-bg: #0F1225;
            --admin-card: #1A1F36;
            --admin-accent: #6C5CE7;
            --admin-accent-hover: #5A4BD1;
            --admin-text: #E2E8F0;
            --admin-muted: #94A3B8;
            --admin-border: rgba(255,255,255,0.06);
            --admin-danger: #E17055;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Almarai', sans-serif;
            background: var(--admin-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Animated background gradient */
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(0,184,148,0.06) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, 5%) rotate(3deg); }
        }
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .login-card {
            background: var(--admin-card);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px var(--admin-border);
            backdrop-filter: blur(20px);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 12px;
        }
        .login-logo img {
            height: 48px;
            opacity: 0.9;
        }
        .login-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--admin-accent), #A29BFE);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }
        .login-title {
            color: var(--admin-text);
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-subtitle {
            color: var(--admin-muted);
            font-size: 0.9rem;
            margin-bottom: 32px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: var(--admin-muted);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }
        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--admin-border);
            border-radius: 14px;
            color: var(--admin-text);
            font-family: 'Almarai', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .form-input:focus {
            border-color: var(--admin-accent);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
            background: rgba(255,255,255,0.06);
        }
        .input-icon-wrapper {
            position: relative;
        }
        .input-icon-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin-muted);
            font-size: 0.9rem;
        }
        .input-icon-wrapper .form-input {
            padding-right: 46px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--admin-accent), #A29BFE);
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Almarai', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108,92,231,0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
        }
        .login-footer a {
            color: var(--admin-accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: color 0.3s;
        }
        .login-footer a:hover {
            color: #A29BFE;
        }
        /* Alert styling */
        .login-alert {
            background: rgba(225,112,85,0.1);
            border: 1px solid rgba(225,112,85,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: var(--admin-danger);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .login-alert.success {
            background: rgba(0,184,148,0.1);
            border-color: rgba(0,184,148,0.2);
            color: #00B894;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='new_design/images/logowhite.png') }}" alt="فائدة">
            </div>
            <div class="text-center">
                <span class="login-badge">ADMIN PANEL</span>
            </div>
            <h1 class="login-title">تسجيل الدخول</h1>
            <p class="login-subtitle">لوحة تحكم المديرين — منصة فائدة</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="login-alert {% if category == 'success' %}success{% endif %}">
                            <i class="fas {% if category == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.admin_login') }}" autocomplete="off">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" class="form-input" placeholder="admin@faeda.com" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-shield-alt ms-2"></i>
                    دخول لوحة التحكم
                </button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('core.home') }}"><i class="fas fa-arrow-right ms-1"></i> العودة للموقع</a>
            </div>
        </div>
    </div>
</body>
</html>
