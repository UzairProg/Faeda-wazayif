<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فائدة | إنشاء حساب</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='new_design/images/Group.png') }}" type="image/x-icon">
    
    <style>
        :root {
            --primary-dark: #232E4C;
            --primary-light: #253048;
            --accent-red: #BF2A4A;
            --accent-yellow: #F0BF56;
            --bg-light: #F0F1F0;
        }

        body {
            font-family: 'Almarai', sans-serif;
            background-color: var(--bg-light);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .almarai-light { font-weight: 300; }
        .almarai-regular { font-weight: 400; }
        .almarai-bold { font-weight: 700; }
        .almarai-extrabold { font-weight: 800; }

        /* Navbar & Footer */
        .navbar { background-color: var(--primary-dark); padding: 15px 0; }
        .nav-link { color: #ffffff !important; transition: color 0.3s ease; }
        .nav-link:hover { color: var(--accent-yellow) !important; }
        footer { background-color: #1A2237; color: white; padding: 60px 0 20px 0; margin-top: auto; }
        .footer-links a { color: #d1d5db; text-decoration: none; display: block; margin-bottom: 10px; transition: color 0.3s; }
        .footer-links a:hover { color: var(--accent-yellow); }
        .social-icon { color: white; font-size: 1.5rem; margin: 0 10px; transition: transform 0.3s; }
        .social-icon:hover { transform: translateY(-3px); color: var(--accent-yellow); }

        /* Form Customization */
        .auth-card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            padding: 40px;
            margin-top: 60px;
            margin-bottom: 60px;
            border-top: 5px solid var(--primary-dark);
        }
        .form-label {
            color: var(--primary-dark);
            font-weight: 700;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            background-color: #f8f9fa;
        }
        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 0.2rem rgba(35, 46, 76, 0.25);
        }
        .btn-custom-red {
            background-color: var(--accent-red);
            color: white;
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: 700;
            border: none;
            transition: transform 0.3s, background-color 0.3s;
        }
        .btn-custom-red:hover {
            background-color: #9e203b;
            transform: translateY(-2px);
            color: white;
        }

        /* Radio Buttons for Role Selection */
        .radio-btns input[type="radio"] {
            display: none;
        }
        .radio-btns label {
            display: inline-block;
            width: 130px;
            padding: 15px;
            margin: 10px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #fff;
        }
        .radio-btns label img {
            display: block;
            margin: 0 auto 10px auto;
            border-radius: 10px;
            background-color: var(--accent-yellow);
            padding: 8px;
        }
        .radio-btns input[type="radio"]:checked + label {
            border-color: var(--primary-dark);
            background-color: #f8f9fa;
            box-shadow: 0 5px 15px rgba(35, 46, 76, 0.1);
        }
        .radio-btns input[type="radio"]:checked + label h5 {
            color: var(--primary-dark);
            font-weight: 800;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('core.home') }}">
                <img src="{{ url_for('static', filename='new_design/images/logowhite.png') }}" height="40" alt="Faeda Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" style="background-color: white;">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 pe-4">
                    <li class="nav-item"><a class="nav-link almarai-bold" href="{{ url_for('core.home') }}">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link almarai-bold" href="/job-list">البحث عن عمل</a></li>
                    <li class="nav-item"><a class="nav-link almarai-bold" href="#footer">تواصل معنا</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="col-md-10 col-lg-8">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <h2 class="almarai-extrabold" style="color: var(--primary-dark);">إنشاء حساب جديد</h2>
                    <p class="almarai-regular text-muted">انضم إلى منصة فائدة وابدأ رحلتك المهنية</p>
                </div>

                {% if msg != None %}
                <div class="hidden" class="alert alert-danger almarai-bold text-center" role="alert">
                    {{ msg }}
                </div>
                {% endif %}

                <form class="login-form" action="/register" method="post">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label almarai-bold">الاسم الأول</label>
                            <input type="text" class="form-control almarai-regular" name="fName" placeholder="أدخل الاسم الأول" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label almarai-bold">الاسم الأخير</label>
                            <input type="text" class="form-control almarai-regular" name="lName" placeholder="أدخل الاسم الأخير" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label almarai-bold">البريد الإلكتروني</label>
                            <input type="email" class="form-control almarai-regular" name="email" placeholder="example@domain.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label almarai-bold">رقم الجوال</label>
                            <input type="text" class="form-control almarai-regular" name="phoneNumber" placeholder="مثال: +9665..." required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label almarai-bold">كلمة المرور</label>
                            <input type="password" class="form-control almarai-regular" name="password" placeholder="أدخل كلمة المرور" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label almarai-bold">تأكيد كلمة المرور</label>
                            <input type="password" class="form-control almarai-regular" name="passwordProve" placeholder="أعد إدخال كلمة المرور" required>
                        </div>
                    </div>

                    <div class="text-center mb-4">
                        <label class="form-label almarai-extrabold fs-5 mb-3">تسجيل كـ :</label>
                        <div class="radio-btns d-flex justify-content-center flex-wrap">
                            <input type="radio" id="individual" name="userrole" value="customers" checked>
                            <label for="individual">
                                <img src="{{ url_for('static', filename='new_design/images/people.png') }}" height="50" alt="أفراد">
                                <h5 class="almarai-regular m-0">أفراد</h5>
                            </label>

                            <input type="radio" id="enterprise" name="userrole" value="company">
                            <label for="enterprise">
                                <img src="{{ url_for('static', filename='new_design/images/enterprise.png') }}" height="50" alt="منشآت">
                                <h5 class="almarai-regular m-0">منشآت</h5>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom-red w-100 almarai-bold mb-4 fs-5">إنشاء حساب</button>

                    <div class="text-center mt-3 almarai-regular">
                        <span class="text-muted">لديك حساب بالفعل؟</span>
                        <a href="{{ url_for('customer.get_login') }}" class="almarai-bold" style="color: var(--primary-dark); text-decoration: underline;">تسجيل الدخول هنا</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer">
        <div class="container">
            <div class="row text-end">
                <div class="col-lg-6 mb-4">
                    <h4 class="almarai-extrabold mb-4" style="color: var(--accent-yellow);">بيانات التواصل</h4>
                    <div class="footer-links almarai-regular">
                        <a href="tel:+96655777430"><i class="fas fa-phone ms-2"></i> +966 55777430</a>
                        <a href="mailto:info@faeda.com.ca"><i class="fas fa-envelope ms-2"></i> info@faeda.com.ca</a>
                    </div>
                </div>

                <div class="col-lg-6 mb-4 text-center text-lg-end">
                    <a href="{{ url_for('core.home') }}">
                        <img src="{{ url_for('static', filename='new_design/images/logowhite.png') }}" height="60" alt="Faeda Logo" class="mb-4">
                    </a>
                    <h5 class="almarai-bold mb-3">تجدونا على</h5>
                    <div>
                        <a href="#" class="social-icon"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="social-icon"><img src="{{ url_for('static', filename='new_design/images/Xlogo.png') }}" width="24" alt="X"></a>
                    </div>
                </div>
            </div>
            <hr class="mt-4 mb-4" style="border-color: rgba(255,255,255,0.1);">
            <div class="d-flex justify-content-between align-items-center">
                <p class="mb-0 almarai-light">منصة فائدة 2023 | جميع الحقوق المحفوظة &copy;</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
