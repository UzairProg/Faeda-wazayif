<!--
==============================================================================
الوظيفة الأساسية للملف: قالب HTML (Template) لعرض رسائل الأخطاء للمستخدم.
الروابط أو الميزات: يستخدم محرك Jinja2 لوراثة القوالب وعرض المتغيرات المرسلة من الـ Backend.
المتطلبات الخاصة: يعتمد على القالب الأساسي base.html وملفات التنسيق (CSS/JS) الموجودة في مجلد static.
==============================================================================
-->
{% extends 'new_design/base.html' %}
{% block title %}خطأ | منصة فائدة{% endblock %}

{% block extra_css %}
<style>
    .error-section {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .error-card {
        background: white;
        border-radius: 20px;
        padding: 50px 40px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        text-align: center;
        max-width: 500px;
        width: 100%;
    }
    .error-icon {
        font-size: 4rem;
        color: var(--accent-red);
        margin-bottom: 20px;
    }
    .error-card h2 {
        color: var(--primary-dark);
        font-weight: 800;
        margin-bottom: 15px;
    }
    .error-card p {
        color: #6c757d;
        font-size: 1.1rem;
        margin-bottom: 30px;
    }
    .btn-back {
        background-color: var(--primary-dark);
        color: white;
        border-radius: 30px;
        padding: 12px 35px;
        font-weight: 700;
        border: none;
        text-decoration: none;
        transition: transform 0.3s, background-color 0.3s;
    }
    .btn-back:hover {
        background-color: var(--accent-red);
        transform: translateY(-3px);
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h2 class="almarai-extrabold">حدث خطأ</h2>
        <p class="almarai-regular">{{ error_message if error_message else 'عذراً، حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.' }}</p>
        <a href="/" class="btn-back almarai-bold">العودة للرئيسية</a>
    </div>
</section>
{% endblock %}
