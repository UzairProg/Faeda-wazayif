<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='/new_design/css/bootstrap.min.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .background-1 {
      position: fixed;
      width: 40%;
      height: 100%;
      background-image: url("{{ url_for('static', filename='/new_design/images/register.png') }}");
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 1;
    }

    .input-style {
      border-radius: 6px;
      padding: 5px;
    }

    .almarai-light {
      font-family: "Almarai", sans-serif;
      font-weight: 300;
      font-style: normal;
    }

    .almarai-regular {
      font-family: "Almarai", sans-serif;
      font-weight: 400;
      font-style: normal;
    }

    .almarai-bold {
      font-family: "Almarai", sans-serif;
      font-weight: 700;
      font-style: normal;
    }

    .almarai-extrabold {
      font-family: "Almarai", sans-serif;
      font-weight: 800;
      font-style: normal;
    }

    .hover-effect a {
      text-decoration: none;
      color: inherit;
      text-align: center;
    }

    .hover-effect a img {
      display: block;
      margin: 0 auto;
      padding: 5px;
      background-color: #F8C44F;
      transition: background-color 0.3s ease, transform 0.3s ease;
      border-radius: 20%;
    }

    .hover-effect a:hover img {
      transform: scale(1.1);
    }

    .btn-hover {
      background-color: #4680EE;
      transition: transform 0.3s, background-color 0.3s;
    }

    .btn-hover:hover {
      background-color: #3570D9;
      transform: scale(1.1);
    }

    @keyframes slideInFromLeft {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }

      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .effect {
      animation: slideInFromLeft 1s ease-out;
    }
    @keyframes slideInFromRight {
      0% {
        transform: translateX(100%);
        opacity: 0;
      }

      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .text-effect {
      animation: slideInFromRight 1s ease-out;
    }
    .input-style {
      transition: all 0.3s ease-in-out;
  }

  .input-style:focus , .input-style:hover  {
      transform: scale(1.1);
  }
    @media (max-width: 992px) {
      .background-1 {
        display: none;
      }

      .container {
        margin-top: 5px;
      }

      .input-style {
        font-size: 14px;
      }

      .btn {
        font-size: 16px;
        margin-right: 12px;
      }

      .on_mobile {
        margin-left: 50px;
      }

      .hover-effect a {
        margin-bottom: 10px;
      }

      .hover-effect h5 {
        font-size: 14px;
      }

      .col-order-md-1 {
        order: 1;
      }

      .col-order-md-2 {
        order: 2;
      }

      .btn-hover {
        background-color: #4680EE;
        transition: transform 0.3s, background-color 0.3s;
      }

      .btn-hover:hover {
        background-color: #3570D9;
        transform: scale(1.1);
      }

    }

    @media (min-width: 992px) and (max-width: 1199.98px) {
      .background-1 {
        display: none;
      }

      .container {
        margin-top: 30px;
      }

      .l {
        font-size: 20px;
      }

      .btn-hover {
        background-color: #4680EE;
        transition: transform 0.3s, background-color 0.3s;
      }

      .btn-hover:hover {
        background-color: #3570D9;
        transform: scale(1.1);
      }
    }

    @media (min-width: 1200.00px) and (max-width: 1399.98px) {
      .background-1 {
        display: none;
      }

      .l {
        font-size: 20px;
      }

      .btn-hover {
        background-color: #4680EE;
        transition: transform 0.3s, background-color 0.3s;
      }

      .btn-hover:hover {
        background-color: #3570D9;
        transform: scale(1.1);
      }
    }
  </style>
</head>

<body>

  <div class="text-right mb-4 mt-3 mr-3">
    <a href="{{ url_for('core.home') }}" class="btn almarai-bold" style="background-color: #232E4C; color: white; border-radius: 10px; padding: 8px 20px; text-decoration: none;">
        العودة للصفحة الرئيسية <i class="fas fa-arrow-left ml-2"></i> 
    </a>
</div>

  <div class="background-1 effect"></div>
  <div class="container-fluid almarai-regular p-2" style="background-color: #253048;">
    <h1 class="text-right text-light almarai-regular p-3 " style="font-size: 40px;">نسيت كلمة المرور </h1>
  </div>

  <div class="container almarai-extrabold p-3 mr-2 " style="text-align: right; font-size: 15px;">

    <div class="container almarai-extrabold d-block justify-content-end p-1 "
      style="text-align: right; font-size: 15px; margin-top: 200px;">
      <form class="login-form " action="/forgot_password" method="post">
        {% if error %}
        <h1 style="color: red;">البريد الالكتروني غير صحيح</h1>
        {% endif %}
        <h1></h1>
        <div class="row justify-content-center ">
          <div class="col-md-6 col-lg-4 col-order-md-1 ">
            <label class="l text-effect" for="firstName" style="font-size: 25px;">البريد الالكتروني </label>
            <input type="text" class="form-control input-style p-3 text-effect" style="text-align: right;font-size: 25px; " name="email"
              placeholder="البريد الالكتروني" required>
            <br> 
            <div class="container d-flex justify-content-center align-items-center">
              <button class="" type="submit" style="
          
          padding: 15px 70px; 
          text-decoration: none; 
          background-color: #3570D9; 
          color: white; 
          border-radius: 6px; 
          transition: background-color 0.3s, color 0.3s;
          display: inline-block; " onmouseover="this.style.backgroundColor='#2851a3'; this.style.color='#e0e0e0';"
                onmouseout="this.style.backgroundColor='#3570D9'; this.style.color='white';">
                التالي
              </button>
            </div>

          </div>
        </div>
      </form>
    </div>
  </div>
</body>



<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
