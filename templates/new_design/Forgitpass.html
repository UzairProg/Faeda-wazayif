<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Login / Sign Up Form</title>
    <link rel="stylesheet" href="/static/assets3/css/login.css">
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/assets3/css/style.css">

    <link rel="preload" as="image" href="/static/assets3/images/Untitled_logo_2_free-file.jpg">
</head>

<body class="body3">
    <div dir="ltr">
       
    </div>
    <div class="container3">
        <form class="form" id="login" action="/forgot_password" method="POST">
            <h1 class="form__title">العثور على حسابك</h1>
            {% if error %}
          
              <style>
                .flash-message {
                  background-color: #ff0000;
                  color: #ffffff;
                  padding: 15px;
                  border-radius: 10px;
                  border: 2px solid #4a3f8a; /* Amazing border color */
                  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                  opacity: 1;
                  transition: opacity 0.5s ease-in-out;
                }
          
                .fadeOut {
                  opacity: 0;
                }
              </style>
          
              <div class="flash-message" role="alert">
                {{ error }}
              </div>
          
              <script>
                document.addEventListener('DOMContentLoaded', function () {
                  var flashMessage = document.querySelector('.flash-message');
          
                  setTimeout(function () {
                    flashMessage.classList.add('fadeOut');
                    setTimeout(function () {
                      flashMessage.parentNode.removeChild(flashMessage);
                    }, 500); // 500 milliseconds for fade-out animation
                  }, 5000); // 5000 milliseconds = 5 seconds
                });
              </script>
          
          {% endif %}
          
            <h3>يرجى إدخال بريدك الإلكتروني لإعادة تعيين كلمة المرور الخاصة بك.</h3>
            <div class="form__input-group">
                <input type="email" class="form__input" name="email" autofocus placeholder="البريد الالكتروني">
                <div class="form__input-error-message"></div>
            </div>
            <button class="form__button" type="submit">
                إرسال
            </button>
        </form>

        <script src="/static/assets3/js/script.js"></script>
    </div>
</body>

</html>
