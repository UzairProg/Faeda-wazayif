{% extends 'new_design/base.html' %}
{% block title %}بوابة المنشآت | تسجيل جديد{% endblock %}

{% block extra_css %}
<style>
    /* Form Customization */
    .auth-card {
        background-color: white;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        padding: 40px;
        margin-top: 60px;
        margin-bottom: 60px;
        border-top: 5px solid var(--accent-red);
    }
    .form-control {
        border-radius: 10px;
        padding: 12px 15px;
        border: 1px solid #ced4da;
        background-color: #f8f9fa;
    }
    .form-control:focus {
        border-color: var(--primary-light);
        box-shadow: 0 0 0 0.2rem rgba(35, 46, 76, 0.25);
    }
    .btn-custom-red {
        background-color: var(--accent-red);
        color: white;
        border-radius: 10px;
        padding: 12px 25px;
        font-weight: 700;
        border: none;
        transition: transform 0.3s, background-color 0.3s;
    }
    .btn-custom-red:hover {
        background-color: #9e203b;
        transform: translateY(-2px);
        color: white;
    }
    .input-group-text {
        background-color: #f8f9fa;
        border-left: none;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}

    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="col-md-8 col-lg-5">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <h2 class="almarai-extrabold" style="color: var(--primary-dark);">بوابة المنشآت</h2>
                    <p class="almarai-regular text-muted">قم بتسجيل منشأتك لنشر الوظائف والبحث عن كفاءات</p>
                </div>

                

                <form class="login-form" action="{{ url_for('company_panel.company_register') }}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label almarai-bold" style="color: var(--primary-dark);">اسم المنشأة</label>
                        <input type="text" class="form-control almarai-regular" name="company_name" placeholder="أدخل اسم المنشأة" required value="{{ request.form.get('company_name', '') }}"
                        oninvalid="this.setCustomValidity('يرجى إدخال اسم المنشأة')"
                        oninput="this.setCustomValidity('')">
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label almarai-bold" style="color: var(--primary-dark);">البريد الإلكتروني للشركة</label>
                        <input type="email" class="form-control almarai-regular" name="email" id="exampleInputEmail1" placeholder="أدخل البريد الإلكتروني" required dir="rtl" value="{{ request.form.get('email', '') }}"
                        oninvalid="this.setCustomValidity('يرجى إدخال بريد إلكتروني صحيح')"
                        oninput="this.setCustomValidity('')">
                    </div>
                    
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label almarai-bold" style="color: var(--primary-dark);">كلمة المرور</label>
                        <div class="input-group">
                            <input type="password" class="form-control almarai-regular" name="password" id="exampleInputPassword1" placeholder="أدخل كلمة المرور" required style="border-left: none;"
                            pattern="(?=.*[!@#$&*]).{8,}" title="يجب أن تتكون كلمة المرور من 8 أحرف على الأقل وتحتوي على رمز خاص من (!@#$&*)"
                            oninvalid="this.setCustomValidity('يجب أن تتكون كلمة المرور من 8 أحرف على الأقل وتحتوي على رمز خاص من (!@#$&*)')"
                            oninput="this.setCustomValidity('')">
                            <span class="input-group-text" id="togglePassword">
                                <i id="eyeIcon" class="fa-solid fa-eye text-muted"></i>
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom-red w-100 almarai-bold mb-4 fs-5">إنشاء الحساب</button>

                    <div class="text-center mt-3 almarai-regular">
                        <span class="text-muted">لديك حساب بالفعل؟</span>
                        <a href="{{ url_for('company_panel.company_login') }}" class="almarai-bold" style="color: var(--primary-dark); text-decoration: underline;">تسجيل الدخول</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById("togglePassword").addEventListener("click", function () {
        var passwordField = document.getElementById("exampleInputPassword1");
        var eyeIcon = document.getElementById("eyeIcon");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        }
    });
</script>
{% endblock %}
